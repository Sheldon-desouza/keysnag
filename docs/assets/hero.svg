<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="keysnag: cybersecurity for AI founders and vibe coders. The pre-push security gate for apps built with Claude Code, Cursor, Lovable and Bolt.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e2a44" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)" opacity="0.6"/>
  <circle cx="1010" cy="120" r="150" fill="#22d3ee" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1090" cy="330" r="110" fill="#a3e635" opacity="0.08" filter="url(#glow)"/>

  <!-- key + snag mark -->
  <g transform="translate(72,96)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="#111c31" stroke="#22d3ee" stroke-width="2"/>
    <g transform="translate(24,26)" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="22" cy="24" r="16"/>
      <path d="M34 36 L70 72 M56 58 L64 50 M64 66 L72 58"/>
    </g>
    <path d="M18 104 Q60 118 102 104" fill="none" stroke="#a3e635" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  </g>

  <text x="230" y="150" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">keysnag</text>
  <text x="230" y="200" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#cbd5e1">Cybersecurity for AI founders and vibe coders.</text>
  <text x="230" y="238" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">The pre-push security gate for apps built with Claude Code, Cursor, Lovable and Bolt.</text>

  <!-- stat pills -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <g transform="translate(230,282)">
      <rect width="196" height="44" rx="22" fill="#0f1b30" stroke="#22d3ee" stroke-opacity="0.6"/>
      <text x="98" y="28" text-anchor="middle" fill="#e2e8f0">12 checks, offline</text>
    </g>
    <g transform="translate(440,282)">
      <rect width="236" height="44" rx="22" fill="#0f1b30" stroke="#a3e635" stroke-opacity="0.6"/>
      <text x="118" y="28" text-anchor="middle" fill="#e2e8f0">Blocks the push on critical</text>
    </g>
    <g transform="translate(690,282)">
      <rect width="250" height="44" rx="22" fill="#0f1b30" stroke="#f472b6" stroke-opacity="0.6"/>
      <text x="125" y="28" text-anchor="middle" fill="#e2e8f0">Never prints a secret</text>
    </g>
  </g>

  <text x="230" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#67e8f9">$ keysnag install   # add the gate to any repo, works in Cursor, VS Code, terminal, CI</text>
</svg>
